[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redqueen"
version = "0.0.1"
description = "A co-evolving, gaming-resistant evaluation loop for a VLA policy"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["redqueen*"]
